name: Build and test

on:
  push:
    branches: [main, "qa/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / C++20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  quality:
    name: Formatting and static analysis / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format clang-tidy
      - name: Check C++ formatting
        shell: bash
        run: |
          mapfile -t sources < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx')
          if [[ ${#sources[@]} -eq 0 ]]; then
            echo 'No tracked C++ source or header files were found.' >&2
            exit 1
          fi
          clang-format --dry-run --Werror "${sources[@]}"
      - name: Export formatted source preview
        if: always()
        shell: bash
        run: |
          mapfile -t sources < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx')
          mkdir -p "$RUNNER_TEMP/clang-formatted"
          for source in "${sources[@]}"; do
            mkdir -p "$RUNNER_TEMP/clang-formatted/$(dirname "$source")"
            clang-format "$source" > "$RUNNER_TEMP/clang-formatted/$source"
          done
      - name: Upload formatted source preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-formatted-source-preview
          path: ${{ runner.temp }}/clang-formatted/
          if-no-files-found: error
          retention-days: 1
      - name: Configure static analysis build
        run: cmake -S . -B build-analysis -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_CLANG_TIDY=clang-tidy;--checks=clang-analyzer-*;--warnings-as-errors=*"
      - name: Build with static analysis
        run: cmake --build build-analysis --config Release
      - name: Test analyzed build
        run: ctest --test-dir build-analysis -C Release --output-on-failure
